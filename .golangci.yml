version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - linters:
          - gosec
        text: "G304"
      - linters:
          - gosec
        text: "G204"

formatters:
  enable:
    - gofmt
    - goimports
